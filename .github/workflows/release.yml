name: Release
# Push a tag vX.Y.Z (matching package.json "version") to publish @straitlink/cli to npm.
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret exists or is needed.
# Trusted Publishing is linked on npmjs.com (3 Nov 2026: this repo, workflow release.yml).
# v0.1.3 and v0.2.0 failed with a 404 on PUT because it was not linked yet; both were published by hand.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance attestation
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # trusted publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm '+process.argv[1]+' < 11.5.1');process.exit(1)}" "$(npm --version)"
          node --version; npm --version
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - name: package.json names this repo (provenance checks repository.url)
        run: |
          want="git+https://github.com/${GITHUB_REPOSITORY}.git"
          got="$(node -p "require('./package.json').repository.url")"
          [ "$got" = "$want" ] || { echo "::error::repository.url is $got, expected $want"; exit 1; }
      - run: npm test
      - name: SDK pins are the registries' latest (never publish a CLI that installs old SDKs)
        run: npm run check:sdk-versions
      - run: npm pack --dry-run
      - name: Already on npm? (a hand-published version runs the tests and skips the publish)
        id: published
        run: |
          n="$(node -p "require('./package.json').name")"; v="$(node -p "require('./package.json').version")"
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "::notice::$n@$v is already on npm, nothing to publish"; echo skip=true >> "$GITHUB_OUTPUT"; fi
      - name: Publish to npm (trusted publishing, provenance on)
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
